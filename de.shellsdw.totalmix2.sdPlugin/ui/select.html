<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  <style>
    .hint {
      color: #969696;
      font-size: 11px;
      line-height: 1.4;
      margin: 2px 12px 8px;
    }
  </style>
</head>
<body>
  <sdpi-item label="Action">
    <sdpi-select setting="mode" default="submix">
      <option value="submix">Select submix</option>
      <option value="bankStart">Set bank start / channel</option>
      <option value="offsetInBank">Set channel offset in bank</option>
      <option value="bus">Select bus</option>
      <option value="quickWorkspace">Load Quick Workspace</option>
      <option value="snapshot">Load snapshot</option>
      <option value="nav">Bank navigation</option>
    </sdpi-select>
  </sdpi-item>

  <div id="row-value" hidden>
    <sdpi-item label="Index" id="value-item">
      <sdpi-range setting="value" min="0" max="30" step="1" default="0" showlabels></sdpi-range>
    </sdpi-item>
    <p class="hint" id="value-hint"></p>
  </div>

  <div id="row-bus" hidden>
    <sdpi-item label="Bus">
      <sdpi-select setting="bus" default="output">
        <option value="input">Input</option>
        <option value="playback">Playback</option>
        <option value="output">Output</option>
      </sdpi-select>
    </sdpi-item>
  </div>

  <div id="row-nav" hidden>
    <sdpi-item label="Navigate">
      <sdpi-select setting="nav" default="trackNext">
        <option value="trackNext">Next track</option>
        <option value="trackPrev">Previous track</option>
        <option value="bankNext">Next bank</option>
        <option value="bankPrev">Previous bank</option>
      </sdpi-select>
    </sdpi-item>
  </div>

  <details>
    <summary>Connection</summary>
    <sdpi-item label="Host">
      <sdpi-textfield setting="host" default="127.0.0.1"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Port incoming">
      <sdpi-textfield setting="sendPort" default="7001"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Port outgoing">
      <sdpi-textfield setting="receivePort" default="9001"></sdpi-textfield>
    </sdpi-item>
  </details>

  <script>
    (function () {
      // Deliberately independent of sdpi-components internals: reads the rendered
      // control's value straight from the DOM and re-applies visibility on user
      // input and on a slow poll (covers programmatic/late initialisation).
      function valueOf(setting, fallback) {
        var host = document.querySelector('[setting="' + setting + '"]');
        if (!host) return fallback;
        if (host.value !== undefined && host.value !== null && host.value !== "") return host.value;
        var inner = host.querySelector("select,input");
        return inner && inner.value ? inner.value : fallback;
      }

      function watch(apply) {
        var run = function () { try { apply(valueOf); } catch (e) {} };
        document.addEventListener("change", run, true);
        document.addEventListener("input", run, true);
        setInterval(run, 250);
        run();
      }

      window.__watchSettings = watch;
    })();
  </script>
  <script>
    __watchSettings(function (v) {
      var m = v("mode", "submix");
      var MODES = {
        submix: { min: 0, max: 30, hint: "Submix index — numbering starts at 0." },
        bankStart: { min: 0, max: 63, hint: "Channel index — 0 is the first channel; a stereo pair counts as one." },
        offsetInBank: { min: 0, max: 23, hint: "Fader position within the bank, starting at 0." },
        quickWorkspace: { min: 1, max: 30, hint: "Quick Workspace slot, 1–30." },
        snapshot: { min: 1, max: 8, hint: "Snapshot 1–8, as numbered in TotalMix's snapshot pane." }
      };
      var cfg = MODES[m];
      document.getElementById("row-value").hidden = !cfg;
      document.getElementById("row-bus").hidden = m !== "bus";
      document.getElementById("row-nav").hidden = m !== "nav";
      if (cfg) {
        var r = document.querySelector("#row-value sdpi-range");
        if (r) {
          if (r.getAttribute("min") !== String(cfg.min)) r.setAttribute("min", String(cfg.min));
          if (r.getAttribute("max") !== String(cfg.max)) r.setAttribute("max", String(cfg.max));
        }
        document.getElementById("value-hint").textContent = cfg.hint;
      }
    });
  </script>
</body>
</html>
